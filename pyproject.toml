[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segy-accept"
version = "0.1.0"
description = "Explain whether a narrow SEG-Y dataset meets a declared receiving policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["segyio==1.9.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "build>=1"]

[project.scripts]
segy-accept = "segy_accept.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
