[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "segy-accept"
version = "1.0.0"
description = "Explain whether a narrow SEG-Y dataset meets a declared receiving policy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["segyio==1.9.14"]
authors = [{name = "Ramal Maharramli"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/MRL-creator/segy-accept"
Issues = "https://github.com/MRL-creator/segy-accept/issues"
Documentation = "https://github.com/MRL-creator/segy-accept/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "build>=1", "psutil>=5.9", "obspy==1.5.1"]
benchmark = ["psutil>=5.9"]
validation = ["obspy==1.5.1"]

[project.scripts]
segy-accept = "segy_accept.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
