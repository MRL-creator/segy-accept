name: Field validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python tools/validate_f3.py --download
      - run: python tools/validate_f3.py --sample similarity --download
      - run: python tools/validate_f3.py --sample npra --download
