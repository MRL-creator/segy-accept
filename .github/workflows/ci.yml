name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=segy_accept --cov-report=term-missing
      - run: python -m build
      - run: python -m segy_accept demo demo-output
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit --skip-editable
