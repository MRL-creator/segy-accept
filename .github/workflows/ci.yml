name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=segy_accept --cov-report=term-missing
      - run: python -m build
      - run: python tools/check_wheel.py
      - run: python -m segy_accept demo demo-output
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit --skip-editable
